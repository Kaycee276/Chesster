name: Tournament Browser Contracts

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  tournament-browser:
    name: Four-viewer tournament bracket
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: frontend/.nvmrc
      - name: Setup pinned pnpm
        run: npm install --global --ignore-scripts --no-audit --no-fund pnpm@11.18.0
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Check tournament bracket rendering contracts
        run: pnpm exec playwright test e2e/tournamentLifecycle.spec.ts
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tournament-browser-results
          path: |
            frontend/test-results
            frontend/playwright-report
          retention-days: 7
          if-no-files-found: warn
