name: Continuous Integration & Code Coverage

on:
  push:
    branches: [ "master", "main", "dev" ]
  pull_request:
    branches: [ "master", "main", "dev" ]

jobs:
  changes:
    name: Detect File Changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      contracts: ${{ steps.filter.outputs.contracts }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check for Workspace Changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            contracts:
              - 'contracts/soroban/**'
              - '.github/workflows/ci.yml'

  backend-ci:
    name: Backend CI & Coverage
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Run Backend Tests with Coverage
        run: npm run test:coverage

      - name: Upload Backend Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage/lcov.info
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  frontend-ci:
    name: Frontend CI & Coverage
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run Frontend Tests with Coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Upload Frontend Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./frontend/coverage/lcov.info
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  contracts-ci:
    name: Soroban Contracts CI & Coverage
    needs: changes
    if: ${{ needs.changes.outputs.contracts == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./contracts/soroban

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./contracts/soroban

      - name: Cache Release WASM
        uses: actions/cache@v4
        with:
          path: ./contracts/soroban/target/wasm32-unknown-unknown/release
          key: ${{ runner.os }}-cargo-release-wasm-${{ hashFiles('contracts/soroban/Cargo.lock') }}

      - name: Install Tools (cargo-tarpaulin & stellar-cli)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin, stellar-cli

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Contract Tests
        run: cargo test

      - name: Build & Optimize Contract
        run: make optimize

      - name: Verify WASM Size Budget & Output Metrics
        run: ./scripts/check-wasm-size.sh target/wasm32-unknown-unknown/release/escrow.wasm

      - name: Generate Coverage Report
        run: cargo tarpaulin --out Lcov --output-dir coverage || true

      - name: Upload Contracts Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./contracts/soroban/coverage/lcov.info
          flags: smart-contracts
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
