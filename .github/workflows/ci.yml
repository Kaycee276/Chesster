name: Continuous Integration & Code Coverage

on:
  push:
    branches: ["master", "main", "dev"]
  pull_request:
    branches: ["master", "main", "dev"]

jobs:
  changes:
    name: Detect File Changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      contracts: ${{ steps.filter.outputs.contracts }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for Workspace Changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.lighthouserc.json'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
            contracts:
              - 'contracts/soroban/**'
              - '.github/workflows/ci.yml'

  backend-ci:
    name: Backend CI & Coverage
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: "backend/.nvmrc"
          cache: "pnpm"
          cache-dependency-path: "backend/pnpm-lock.yaml"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Backend Tests with Coverage
        run: pnpm run test:coverage
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
          SOROBAN_RPC_URL: "https://soroban-testnet.stellar.org"
          NODE_OPTIONS: "--experimental-vm-modules"

      - name: Upload Backend Coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          files: ./backend/coverage/lcov.info
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  frontend-ci:
    name: Frontend CI & Coverage
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: "frontend/.nvmrc"
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Run Frontend Tests with Coverage
        run: pnpm run test:coverage

      - name: Build
        run: pnpm run build

      - name: Verify Bundle Size Budgets
        run: pnpm run size-check

      - name: Run Lighthouse CI
        run: pnpm run lhci

      - name: Upload Lighthouse CI Reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse-reports
          path: frontend/.lighthouseci
          if-no-files-found: warn

      - name: Generate Frontend Bundle Stats
        run: pnpm run build:analyze

      - name: Upload Frontend Bundle Stats
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-bundle-stats
          path: frontend/dist/stats.html
          if-no-files-found: error

      - name: Upload Frontend Coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          files: ./frontend/coverage/lcov.info
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  contracts-ci:
    name: Soroban Contracts CI & Coverage
    needs: changes
    if: ${{ needs.changes.outputs.contracts == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./contracts/soroban

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ./contracts/soroban

      - name: Cache Release WASM
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ./contracts/soroban/target/wasm32-unknown-unknown/release
          key: ${{ runner.os }}-cargo-release-wasm-${{ hashFiles('contracts/soroban/Cargo.lock') }}

      - name: Install Tools (cargo-tarpaulin & stellar-cli)
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-tarpaulin, stellar-cli

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Contract Tests
        run: cargo test

      - name: Run Soroban Contract Property Fuzz Tests
        run: cargo test --release -p escrow fuzz_balance_conservation -- --ignored
        timeout-minutes: 5

      - name: Build & Optimize Contract
        run: make optimize

      - name: Verify WASM Size Budget & Output Metrics
        run: ./scripts/check-wasm-size.sh target/wasm32-unknown-unknown/release/escrow.wasm

      - name: Generate Coverage Report
        run: cargo tarpaulin --out Lcov --output-dir coverage || true

      - name: Upload Contracts Coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          files: ./contracts/soroban/coverage/lcov.info
          flags: smart-contracts
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  docker-build-scan:
    name: Docker Build & Vulnerability Scan
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: chesster-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: chesster-backend:test
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy Scan Results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

      - name: Run Trivy Scan (Table Output for PR Comment)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: chesster-backend:test
          format: "table"
          severity: "CRITICAL"
          exit-code: "0"

  dependency-security-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
          cache-dependency-path: "**/pnpm-lock.yaml"

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      # pnpm audit reads the lockfile, so no install is needed. Only production
      # dependencies are audited. High and critical advisories fail the job unless
      # they are listed in .github/pnpm-audit-ignore.txt; moderate and low only warn.
      - name: Audit root dependencies
        run: scripts/pnpm-audit.sh .

      - name: Audit backend dependencies
        run: scripts/pnpm-audit.sh backend

      - name: Audit frontend dependencies
        run: scripts/pnpm-audit.sh frontend

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Soroban dependencies
        run: cargo audit --file contracts/soroban/Cargo.lock --ignore RUSTSEC-2026-0387

  wasm-size-report:
    name: Soroban Wasm Size Diff
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.contracts == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      SIZE_DIR: ${{ github.workspace }}/wasm-size

    steps:
      - name: Checkout PR Head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head

      - name: Checkout Target Branch Baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            ./head/contracts/soroban
            ./base/contracts/soroban

      - name: Install stellar-cli
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: stellar-cli

      - name: Build and Measure PR Head
        working-directory: head/contracts/soroban
        env:
          WASM_SIZE_JSON_OUT: ${{ env.SIZE_DIR }}/head.json
        run: |
          mkdir -p "$SIZE_DIR"
          make optimize
          # The budget itself is enforced by the Soroban Contracts CI job; this job
          # only reports, so a budget overrun does not stop the comment from posting.
          ./scripts/check-wasm-size.sh target/wasm32-unknown-unknown/release/escrow.wasm || true
          test -s "$WASM_SIZE_JSON_OUT"

      # The baseline is measured with the PR's own scripts so both sides use the
      # same method. A baseline failure (for example a target branch that predates
      # the contract) downgrades the report to head sizes only.
      - name: Build and Measure Target Branch Baseline
        id: baseline
        continue-on-error: true
        working-directory: base/contracts/soroban
        env:
          WASM_SIZE_JSON_OUT: ${{ env.SIZE_DIR }}/base.json
        run: |
          make optimize
          "$GITHUB_WORKSPACE/head/contracts/soroban/scripts/check-wasm-size.sh" \
            target/wasm32-unknown-unknown/release/escrow.wasm || true
          test -s "$WASM_SIZE_JSON_OUT"

      - name: Generate Size Report
        run: |
          ./head/contracts/soroban/scripts/wasm-size-report.sh \
            "$SIZE_DIR/head.json" "$SIZE_DIR/base.json" > "$SIZE_DIR/report.md"
          cat "$SIZE_DIR/report.md" >> "$GITHUB_STEP_SUMMARY"

      # Pull requests from forks receive a read-only token, so the comment can only
      # be posted for branches of this repository. Fork PRs still get the job summary.
      - name: Post or Update PR Comment
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(`${process.env.SIZE_DIR}/report.md`, 'utf8');
            const marker = '<!-- wasm-size-report -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(
              (c) => c.user && c.user.type === 'Bot' && c.body && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  lighthouse-audit:
    name: Lighthouse Web Vitals Audit
    needs: changes
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'dev' && needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: "frontend/.nvmrc"
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Production Artifact
        run: pnpm run build

      - name: Run Lighthouse Web Vitals Audit
        run: pnpm run lhci:audit

      - name: Upload Lighthouse HTML Reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse-web-vitals-reports
          path: frontend/.lighthouseci
          if-no-files-found: warn

      - name: Summarize Web Vitals and Comment on PR
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const manifestPath = path.join('frontend', '.lighthouseci', 'manifest.json');
            if (!fs.existsSync(manifestPath)) {
              core.notice('No Lighthouse manifest found; skipping PR summary comment.');
              return;
            }
            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            const representative = manifest.filter((entry) => entry.isRepresentativeRun);
            const rows = (representative.length > 0 ? representative : manifest).map((entry) => {
              const s = entry.summary || {};
              const fmt = (v) => (typeof v === 'number' ? `${Math.round(v * 100)}` : 'N/A');
              return `| \`${entry.url}\` | ${fmt(s.performance)} | ${fmt(s.accessibility)} | ${fmt(s['best-practices'])} |`;
            });
            const marker = '<!-- lighthouse-web-vitals-report -->';
            const body = [
              marker,
              '### Lighthouse Web Vitals Audit Summary',
              '',
              '| URL | Performance | Accessibility | Best Practices |',
              '| --- | ---: | ---: | ---: |',
              ...rows,
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(
              (c) => c.user && c.user.type === 'Bot' && c.body && c.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
