name: Smart Contract CI

on:
  push:
    branches: [ "master", "main", "dev" ]
    paths:
      - 'contracts/soroban/**'
  pull_request:
    branches: [ "master", "main", "dev" ]
    paths:
      - 'contracts/soroban/**'

jobs:
  test-and-build:
    name: Test, Build & Optimize Contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./contracts/soroban

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./contracts/soroban

      - name: Install Stellar CLI
        uses: taiki-e/install-action@v2
        with:
          tool: stellar-cli

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Build contract
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Optimize Soroban contract WASM
        run: make optimize

      - name: Verify WASM Size Budget & Output Metrics
        run: ./scripts/check-wasm-size.sh target/wasm32-unknown-unknown/release/escrow.wasm
