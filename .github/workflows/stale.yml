name: Close Stale Issues & PRs

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 30
          days-before-close: 7
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          exempt-issue-labels: "pinned,security,in-progress"
          exempt-pr-labels: "pinned,security,in-progress"
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not had
            recent activity. It will be closed in 7 days if no further activity occurs.
            If this issue is still relevant, please leave a comment to keep it open.
            Thank you for your contributions!
          stale-pr-message: >
            This pull request has been automatically marked as stale because it has not had
            recent activity. It will be closed in 7 days if no further activity occurs.
            If this PR is still relevant, please leave a comment to keep it open.
            Thank you for your contributions!
          close-issue-message: >
            This issue has been automatically closed due to inactivity. If you believe
            this issue is still relevant, please feel free to re-open it.
          close-pr-message: >
            This pull request has been automatically closed due to inactivity. If you believe
            this PR is still relevant, please feel free to re-open it.
