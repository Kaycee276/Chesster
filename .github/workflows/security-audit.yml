name: Security & Dependency Vulnerability Audit

on:
  schedule:
    - cron: "0 0 * * 0" # Weekly on Sundays at 00:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "backend/package.json"
      - "backend/package-lock.json"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "contracts/soroban/Cargo.lock"
      - "contracts/soroban/Cargo.toml"

jobs:
  npm-audit:
    name: NPM Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Run Root NPM Audit
        run: npm audit --audit-level=high || true

      - name: Run Backend NPM Audit
        working-directory: ./backend
        run: npm audit --audit-level=high || true

      - name: Run Frontend NPM Audit
        working-directory: ./frontend
        run: npm audit --audit-level=high || true

  cargo-audit:
    name: Soroban Cargo Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Rust Security Audit Check
        uses: rustsec/audit-check-action@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: ./contracts/soroban
