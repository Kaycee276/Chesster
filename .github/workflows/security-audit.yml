name: Security & Dependency Vulnerability Audit

on:
  schedule:
    - cron: "0 0 * * 0" # Weekly on Sundays at 00:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "backend/package.json"
      - "backend/package-lock.json"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "contracts/soroban/Cargo.lock"
      - "contracts/soroban/Cargo.toml"
      - "backend/Dockerfile"
      - "backend/**"
      - ".github/workflows/security-audit.yml"

jobs:
  npm-audit:
    name: NPM Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'

      - name: Run Root NPM Audit
        run: npm audit --audit-level=high || true

      - name: Run Backend NPM Audit
        working-directory: ./backend
        run: npm audit --audit-level=high || true

      - name: Run Frontend NPM Audit
        working-directory: ./frontend
        run: npm audit --audit-level=high || true

  cargo-audit:
    name: Soroban Cargo Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run Rust Security Audit Check
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-audit

      - name: Audit Rust dependencies
        working-directory: ./contracts/soroban
        run: cargo audit

  container-scan:
    name: Backend Container Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build Backend Container
        run: docker build --tag chesster-backend:ci ./backend

      - name: Scan Container and Generate SARIF
        id: trivy
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master
        continue-on-error: true
        with:
          image-ref: chesster-backend:ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: 1

      - name: Upload Trivy SARIF Report
        if: always()
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        with:
          sarif_file: trivy-results.sarif

      - name: Enforce Container Vulnerability Gate
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master
        with:
          image-ref: chesster-backend:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: 1
